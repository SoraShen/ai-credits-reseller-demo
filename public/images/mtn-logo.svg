<svg width="168" height="40" viewBox="0 0 168 40" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MTN AI">
  <!-- Official-style MTN mark: black oval outline + black MTN (not yellow fill) -->
  <ellipse cx="28" cy="20" rx="26" ry="15.5" stroke="#000000" stroke-width="2.4" fill="none"/>
  <text
    x="28"
    y="20"
    text-anchor="middle"
    dominant-baseline="central"
    fill="#000000"
    font-family="Arial Black, Arial, Helvetica, sans-serif"
    font-size="15"
    font-weight="900"
    letter-spacing="0.5"
  >MTN</text>
  <!-- Product wordmark optically centered to the oval -->
  <text
    x="64"
    y="20"
    dominant-baseline="central"
    fill="#000000"
    font-family="Arial, Helvetica, sans-serif"
    font-size="22"
    font-weight="800"
    letter-spacing="-0.6"
  >AI</text>
</svg>
